name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1) 드래프트 릴리즈 먼저 생성 — 매트릭스가 "병렬로" 같은 릴리즈에 업로드하도록
  #    release_id 를 전달. (병렬 시 발생하던 draft 동시 생성 race 차단)
  # ────────────────────────────────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: create
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `매드업 토큰 모니터 ${tag}`,
              body: [
                '## 변경 사항',
                'GitHub Releases에서 자동 업데이트가 지원됩니다.',
                '',
                '### 설치',
                '- macOS (Apple Silicon): `*_aarch64.dmg`',
                '- macOS (Intel): `*_x64.dmg`',
                '- Windows (x64): `*-setup.exe` (SmartScreen: 추가 정보 → 실행) — ⚠️ BETA: 로그인 미검증',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            return data.id;

  # ────────────────────────────────────────────────────────────────────────────
  # 2) 플랫폼별 빌드 — "병렬" 실행. latest.json 은 건드리지 않는다
  #    (includeUpdaterJson: false) → read-modify-write race 없음. .sig 는 그대로 업로드.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        # pnpm 11+ 가 CI 모드에서 ignored build scripts(esbuild의 native 다운로드 등)를
        # 치명적 에러로 처리 — 명시적으로 모든 빌드 허용.
        run: pnpm install --frozen-lockfile --dangerously-allow-all-builds

      - name: Write .env (vite inline)
        # tauri-action 이 sub-process 에 env forwarding 을 일부 누락하는 케이스 우회.
        # vite 가 .env 파일을 직접 읽어 import.meta.env 로 inline 하도록 명시 작성.
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUCCESS_URL: ${{ secrets.VITE_AUTH_SUCCESS_URL }}
        shell: bash
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ] || [ -z "$SUCCESS_URL" ]; then
            echo "::error::Required secrets are missing or empty"
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=$URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$KEY"
            echo "VITE_AUTH_SUCCESS_URL=$SUCCESS_URL"
          } > .env
          echo "✓ .env written ($(wc -l < .env) lines)"

      - name: Build and upload artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 미리 만든 draft 에 업로드 (생성 안 함). latest.json 은 finalize 가 담당.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

  # ────────────────────────────────────────────────────────────────────────────
  # 3) 모든 플랫폼 빌드 후 latest.json 1개를 조립해 업로드.
  #    각 플랫폼 .sig + 아티팩트 URL 을 모아 단일 latest.json 생성 → 자동 업데이트 정상.
  # ────────────────────────────────────────────────────────────────────────────
  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Assemble & upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"

          mkdir -p sigs
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig' --dir sigs

          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          mac_aarch64=$(printf '%s\n' "$assets" | grep 'aarch64\.app\.tar\.gz$' | head -1)
          mac_x64=$(printf '%s\n' "$assets" | grep '_x64\.app\.tar\.gz$' | head -1)
          win_x64=$(printf '%s\n' "$assets" | grep -- '-setup\.exe$' | head -1)

          sig_aarch64=$(cat sigs/*aarch64.app.tar.gz.sig)
          sig_x64=$(cat sigs/*_x64.app.tar.gz.sig)
          sig_win=$(cat sigs/*-setup.exe.sig)

          for v in "$mac_aarch64" "$mac_x64" "$win_x64" "$sig_aarch64" "$sig_x64" "$sig_win"; do
            if [ -z "$v" ]; then echo "::error::missing artifact or signature"; exit 1; fi
          done

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg s_aarch64 "$sig_aarch64" --arg u_aarch64 "$BASE/$mac_aarch64" \
            --arg s_x64 "$sig_x64" --arg u_x64 "$BASE/$mac_x64" \
            --arg s_win "$sig_win" --arg u_win "$BASE/$win_x64" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $s_aarch64, url: $u_aarch64 },
                "darwin-x86_64":  { signature: $s_x64,     url: $u_x64 },
                "windows-x86_64": { signature: $s_win,     url: $u_win }
              }
            }' > latest.json

          echo "=== latest.json ==="
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
